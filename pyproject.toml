[project]
name = "obspipe"
version = "0.1.0"
description = "Observability layer for multi-step AI pipelines"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
obspipe = "obspipe.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obspipe"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
# Live tests hit the real Groq API. Excluded by default so `pytest` stays
# offline, free and deterministic; run them with `pytest -m live`.
addopts = "-m 'not live'"
markers = [
    "live: sends real requests to Groq (needs GROQ_API_KEY, costs tokens)",
]
